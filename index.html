<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Done-For-You Local Authority Media</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --accent-color: #38bdf8;
            --text-color: #f3f4f6;
            --muted-text: #9ca3af;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 900px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            line-height: 1.2;
            margin-bottom: 10px;
            font-weight: 800;
        }
        h1 span {
            color: var(--accent-color);
        }
        p.subtitle {
            font-size: 1.2rem;
            color: var(--muted-text);
            margin-bottom: 30px;
        }
        .vsl-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid #222731;
            margin-bottom: 40px;
        }
        .vsl-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .cta-box {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #222731;
        }
        h3 {
            margin-top: 0;
            font-size: 1.3rem;
        }
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .cta-btn {
            background-color: var(--accent-color);
            color: #000;
            text-decoration: none;
            padding: 15px 40px;
            font-weight: 700;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: transform 0.2s, background-color 0.2s;
        }
        .cta-btn:hover {
            transform: translateY(-2px);
            background-color: #7dd3fc;
        }
        .cta-btn.uk {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
        }
        .cta-btn.uk:hover {
            background-color: var(--text-color);
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>We Fix Your <span>Google Maps Profile</span> & Rebuild Your Landing Pages.</h1>
        <p class="subtitle">100% Done-For-You. Watch the briefing below to secure your territory.</p>

        <div class="vsl-wrapper">
            <!-- This is a placeholder standard video layout until your AI VSL is ready -->
            <iframe src="https://youtube.com" allowfullscreen></iframe>
        </div>

        <div class="cta-box">
            <h3>Ready to automate your local lead generation? Select your region to review availability:</h3>
            <div class="btn-group">
                <a href="book-us.html" class="cta-btn">🇺🇸 Secure US Territory</a>
                <a href="book-uk.html" class="cta-btn uk">🇬🇧 Secure UK Territory</a>
            </div>
        </div>
    </div>

</body>
</html>
